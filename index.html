<!doctype html>
<html lang="lo">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>ສຸກສັນວັນເກີດ Nixza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@400;700&family=Noto+Sans+Lao:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --night: #0f1f17;
        --moss: #27412a;
        --indigo: #2b3358;
        --mat: #c4452d;
        --cream: #f6ecd6;
        --gold: #f2b84b;
        --serif: "Noto Serif Lao", "Phetsarath OT", serif;
        --sans: "Noto Sans Lao", "Phetsarath OT", sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(
          120% 90% at 50% 100%,
          var(--moss),
          var(--night) 65%
        );
        color: var(--cream);
        font-family: var(--sans);
        overflow-x: hidden;
      }
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        text-align: center;
        position: relative;
        z-index: 2;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 700;
        font-size: clamp(1.7rem, 6vw, 2.6rem);
        line-height: 1.4;
        margin: 0 0 6px;
      }
      .sub {
        margin: 0 0 28px;
        opacity: 0.8;
        font-size: 1rem;
        min-height: 1.6em;
      }
      button {
        font-family: var(--sans);
        font-size: 1rem;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 13px 28px;
        cursor: pointer;
        background: var(--gold);
        color: #2a1d05;
      }
      button.ghost {
        background: transparent;
        color: var(--cream);
        border: 1px solid rgba(246, 236, 214, 0.4);
        margin-left: 8px;
      }
      button:focus-visible {
        outline: 3px solid var(--cream);
        outline-offset: 3px;
      }
      .actions {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .actions button.ghost {
        margin: 0;
      }

      /* Cake */
      .cake {
        position: relative;
        width: 260px;
        height: 230px;
        margin: 30px auto 0;
      }
      .plate {
        position: absolute;
        bottom: 0;
        left: -20px;
        right: -20px;
        height: 16px;
        border-radius: 50%;
        background: var(--mat);
        box-shadow: 0 8px 0 #8d2d1b;
      }
      .tier {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 14px 14px 6px 6px;
      }
      .t1 {
        bottom: 10px;
        width: 260px;
        height: 100px;
        background: var(--cream);
      }
      .t1::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 44px;
        border-radius: 0 0 6px 6px;
        background:
          conic-gradient(
              from 45deg at 50% 50%,
              #8f98c9 0 25%,
              transparent 0 50%,
              #8f98c9 0 75%,
              transparent 0
            )
            0 0/22px 22px,
          var(--indigo);
      }
      .t2 {
        bottom: 110px;
        width: 176px;
        height: 70px;
        background: #fff6e2;
      }
      .t2::after,
      .t1::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -2px;
        height: 18px;
        border-radius: 14px 14px 40% 40%;
        background: #fff;
        opacity: 0.9;
      }
      .candles {
        position: absolute;
        bottom: 178px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 30px;
      }
      .candle {
        position: relative;
        width: 12px;
        height: 46px;
        border-radius: 3px;
        background: repeating-linear-gradient(
          -45deg,
          var(--mat) 0 7px,
          var(--cream) 7px 14px
        );
      }
      .flame {
        position: absolute;
        left: 50%;
        top: -26px;
        width: 14px;
        height: 24px;
        margin-left: -7px;
        border-radius: 50% 50% 50% 50%/65% 65% 35% 35%;
        background: radial-gradient(
          circle at 50% 70%,
          #fff3b0,
          var(--gold) 55%,
          #e8731f
        );
        transform-origin: 50% 100%;
        animation: flick 0.35s ease-in-out infinite alternate;
        box-shadow: 0 0 22px 6px rgba(242, 184, 75, 0.55);
      }
      @keyframes flick {
        from {
          transform: scale(1, 1) rotate(-3deg);
        }
        to {
          transform: scale(0.92, 1.08) rotate(3deg);
        }
      }
      .candle.out .flame {
        animation: none;
        opacity: 0;
        transform: scale(0.2);
        transition:
          opacity 0.25s,
          transform 0.25s;
      }
      .smoke {
        position: absolute;
        left: 50%;
        top: -30px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(246, 236, 214, 0.5);
        opacity: 0;
      }
      .candle.out .smoke {
        animation: puff 1.6s ease-out forwards;
      }
      @keyframes puff {
        0% {
          opacity: 0.8;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(10px, -60px) scale(5);
        }
      }
      .meter {
        width: min(260px, 70vw);
        height: 6px;
        border-radius: 3px;
        background: rgba(246, 236, 214, 0.15);
        margin: 20px auto 0;
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--gold);
        transition: width 0.08s;
      }

      /* Envelope + letter */
      #gift {
        display: none;
      }
      .env {
        width: min(300px, 80vw);
        height: 200px;
        margin: 10px auto 0;
        background: var(--cream);
        border-radius: 8px;
        position: relative;
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
        border: 0;
        padding: 0;
      }
      .env::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 8px;
        background:
          linear-gradient(
              to top right,
              transparent 49.5%,
              rgba(43, 51, 88, 0.18) 50%
            )
            left/50% 100% no-repeat,
          linear-gradient(
              to top left,
              transparent 49.5%,
              rgba(43, 51, 88, 0.18) 50%
            )
            right/50% 100% no-repeat;
      }
      .env .flap {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 105px;
        background: #e9d9b6;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top;
        transition: transform 0.6s;
      }
      .env .seal {
        position: absolute;
        left: 50%;
        top: 84px;
        width: 42px;
        height: 42px;
        margin-left: -21px;
        border-radius: 50%;
        background: var(--mat);
        color: var(--cream);
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        z-index: 2;
        transition: opacity 0.3s;
      }
      .env.open .flap {
        transform: rotateX(180deg);
      }
      .env.open .seal {
        opacity: 0;
      }
      #letter {
        display: none;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
        background: var(--cream);
        color: #2a2418;
        border-radius: 6px;
        padding: 34px 28px 30px;
        text-align: left;
        font-family: var(--serif);
        line-height: 2;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        border-top: 8px solid var(--indigo);
      }
      #letter h2 {
        font-size: 1.4rem;
        margin: 0 0 14px;
        color: var(--indigo);
      }
      #letter p {
        margin: 0 0 14px;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.7s,
          transform 0.7s;
      }
      #letter p.show {
        opacity: 1;
        transform: none;
      }
      #letter .sign {
        text-align: right;
        color: var(--mat);
        font-weight: 700;
      }

      .polaroid {
        margin: 0 auto 24px;
        width: min(260px, 70%);
        background: #fffdf7;
        padding: 10px 10px 34px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        transform: rotate(-2.5deg);
        opacity: 0;
        transition: opacity 0.8s;
      }
      .polaroid.show {
        opacity: 1;
      }
      .polaroid img {
        display: block;
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
        object-position: 50% 25%;
        background: #ddd;
      }
      .polaroid figcaption {
        font-family: var(--serif);
        text-align: center;
        color: var(--indigo);
        font-size: 0.95rem;
        margin-top: 10px;
        line-height: 1.4;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      @media (prefers-reduced-motion: reduce) {
        .flame {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="fx" aria-hidden="true"></canvas>

    <main class="stage" id="s1">
      <h1>ສຸກສັນວັນເກີດ, Nixza</h1>
      <p class="sub" id="hint">ມີບາງຢ່າງລໍຖ້າເຈົ້າຢູ່… ເປົ່າທຽນກ່ອນເດີ້</p>
      <div class="cake" aria-label="ເຄັກວັນເກີດ">
        <div class="candles">
          <div class="candle">
            <div class="flame"></div>
            <div class="smoke"></div>
          </div>
          <div class="candle">
            <div class="flame"></div>
            <div class="smoke"></div>
          </div>
          <div class="candle">
            <div class="flame"></div>
            <div class="smoke"></div>
          </div>
        </div>
        <div class="tier t2"></div>
        <div class="tier t1"></div>
        <div class="plate"></div>
      </div>
      <div class="meter" id="meter" hidden><i></i></div>
      <div class="actions">
        <button id="mic">ເປົ່າດ້ວຍສຽງ (ເປີດໄມ)</button>
        <button id="tap" class="ghost">ແຕະເພື່ອເປົ່າ</button>
      </div>
    </main>

    <main class="stage" id="gift">
      <h1>ເຈົ້າຂໍພອນແລ້ວບໍ?</h1>
      <p class="sub" id="hint2">ແຕະຊອງຈົດໝາຍເພື່ອເປີດອ່ານ</p>
      <button class="env" id="env" aria-label="ເປີດຈົດໝາຍ">
        <span class="flap"></span><span class="seal"></span>
      </button>
      <article id="letter"></article>
    </main>

      const TO = "Nixza";
      const FROM = "ປລ ຄຸນ";
      const LETTER = [
        "ສຸກສັນວັນເກີດເດີ້! ຂໍໃຫ້ປີນີ້ເປັນປີທີ່ເຈົ້າມີແຕ່ຄວາມສຸກ ແລະ ຍິ້ມໄດ້ທຸກມື້.",
        "ຂໍໃຫ້ສຸຂະພາບແຂງແຮງ, ແລະ ມີແຕ່ຄົນດີໆຢູ່ອ້ອມຂ້າງ ປາດຖະໜາສິ່ງໃດຂໍໃຫ້ໄດ້ສິ່ງນັ້ນ.",
        "ວັນນີ້ເປັນວັນຂອງເຈົ້າ — ກິນເຄັກໃຫ້ອີ່ມເດີ້!",
      ];
      /* ================================= */

      const $ = (id) => document.getElementById(id);
      const candles = [...document.querySelectorAll(".candle")];
      let blown = false;

      /* confetti */
      const cv = $("fx"),
        cx = cv.getContext("2d");
      let bits = [],
        raf = 0;
      function size() {
        cv.width = innerWidth * devicePixelRatio;
        cv.height = innerHeight * devicePixelRatio;
      }
      addEventListener("resize", size);
      size();
      function burst() {
        const cols = ["#f2b84b", "#c4452d", "#8f98c9", "#f6ecd6", "#7bb26a"];
        for (let i = 0; i < 150; i++) {
          bits.push({
            x: innerWidth / 2,
            y: innerHeight * 0.45,
            vx: (Math.random() - 0.5) * 14,
            vy: -Math.random() * 13 - 3,
            w: 6 + Math.random() * 6,
            h: 4 + Math.random() * 5,
            r: Math.random() * 6,
            vr: (Math.random() - 0.5) * 0.4,
            c: cols[i % 5],
          });
        }
        if (!raf) tick();
      }
      function tick() {
        const d = devicePixelRatio;
        cx.clearRect(0, 0, cv.width, cv.height);
        bits.forEach((b) => {
          b.vy += 0.28;
          b.vx *= 0.99;
          b.x += b.vx;
          b.y += b.vy;
          b.r += b.vr;
          cx.save();
          cx.translate(b.x * d, b.y * d);
          cx.rotate(b.r);
          cx.fillStyle = b.c;
          cx.fillRect((-b.w * d) / 2, (-b.h * d) / 2, b.w * d, b.h * d);
          cx.restore();
        });
        bits = bits.filter((b) => b.y < innerHeight + 30);
        raf = bits.length ? requestAnimationFrame(tick) : 0;
        if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
      }

      /* blow out */
      function blowOut() {
        if (blown) return;
        blown = true;
        stopMic();
        candles.forEach((c, i) =>
          setTimeout(() => c.classList.add("out"), i * 220),
        );
        $("hint").textContent = "ເຈົ້າຂໍພອນແລ້ວ! 🎉";
        setTimeout(burst, 700);
        setTimeout(() => {
          $("s1").style.display = "none";
          $("gift").style.display = "flex";
          scrollTo(0, 0);
          burst();
        }, 2600);
      }
      $("tap").onclick = blowOut;
      candles.forEach((c) => (c.onclick = blowOut));

      /* microphone blow detection */
      let ac,
        stream,
        loud = 0,
        mraf = 0;
      async function startMic() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          ac = new (window.AudioContext || window.webkitAudioContext)();
          const an = ac.createAnalyser();
          an.fftSize = 512;
          ac.createMediaStreamSource(stream).connect(an);
          const buf = new Uint8Array(an.fftSize);
          $("meter").hidden = false;
          $("mic").hidden = true;
          $("hint").textContent = "ເປົ່າໃສ່ໄມຂອງໂທລະສັບເບິ່ງ…";
          (function loop() {
            an.getByteTimeDomainData(buf);
            let s = 0;
            for (const v of buf) {
              const x = (v - 128) / 128;
              s += x * x;
            }
            const rms = Math.sqrt(s / buf.length);
            $("meter").firstElementChild.style.width =
              Math.min(100, rms * 400) + "%";
            loud = rms > 0.12 ? loud + 1 : Math.max(0, loud - 1);
            if (loud > 14) return blowOut();
            mraf = requestAnimationFrame(loop);
          })();
        } catch (e) {
          $("hint").textContent =
            "ເປີດໄມບໍ່ໄດ້ — ແຕະປຸ່ມ “ແຕະເພື່ອເປົ່າ” ແທນເດີ້";
        }
      }
      function stopMic() {
        cancelAnimationFrame(mraf);
        try {
          stream && stream.getTracks().forEach((t) => t.stop());
          ac && ac.close();
        } catch (e) {}
      }
      $("mic").onclick = startMic;

      /* letter */
      $("env").onclick = () => {
        $("env").classList.add("open");
        $("hint2").textContent = "";
        setTimeout(() => {
          $("env").style.display = "none";
          const L = $("letter");
          L.innerHTML =
            '<figure class="polaroid"><img alt="ຮູບຂອງ ' +
            TO +
            '" src="' +
            PHOTO +
            '"><figcaption>' +
            TO +
            " </figcaption></figure><h2>ເຖິງ " +
            TO +
            "</h2>" +
            LETTER.map((t) => "<p></p>").join("") +
            '<p class="sign"></p>';
          const ps = [...L.querySelectorAll("p")];
          LETTER.forEach((t, i) => (ps[i].textContent = t));
          ps[ps.length - 1].textContent = " " + FROM + " ";
          L.style.display = "block";
          setTimeout(
            () => L.querySelector(".polaroid").classList.add("show"),
            100,
          );
          ps.forEach((p, i) =>
            setTimeout(() => p.classList.add("show"), 300 + i * 900),
          );
          burst();
        }, 700);
      };
    </script>
  </body>
</html>
